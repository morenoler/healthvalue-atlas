[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "healthvalue-atlas"
version = "1.0.0"
description = "Health economics research, temporal ML evaluation and an interactive country atlas"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4", "numpy>=1.26,<3", "scipy>=1.12,<2",
  "scikit-learn>=1.5,<2", "statsmodels>=0.14,<0.16",
  "matplotlib>=3.9,<4", "requests>=2.32,<3",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
