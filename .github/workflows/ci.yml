name: Research checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install tested dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Rebuild research from frozen sources
        run: python -m healthvalue build
      - name: Run data, leakage and API checks
        run: python -m pytest -q
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: research-results
          path: reports/
